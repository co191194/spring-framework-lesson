<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <style>
      .title { font: bold 22px sans-serif; fill: #2c3e50; }
      .label { font: 16px sans-serif; fill: #34495e; }
      .small-text { font: 13px sans-serif; fill: #7f8c8d; }
      .demerit-box { fill: #ffebee; stroke: #ef5350; stroke-width: 2; }
      .icon { font: 28px sans-serif; }
      .star { fill: #ffa726; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">フレームワークを使うデメリット</text>
  
  <!-- Row 1 -->
  <!-- Demerit 1: Learning Cost -->
  <rect x="30" y="60" width="230" height="140" class="demerit-box" rx="8"/>
  <text x="145" y="90" text-anchor="middle" class="icon">📚</text>
  <text x="145" y="120" text-anchor="middle" class="label" font-weight="bold">学習コスト</text>
  <text x="145" y="145" text-anchor="middle" class="small-text">影響度: ⭐⭐⭐</text>
  <text x="145" y="165" text-anchor="middle" class="small-text">基礎習得: 1〜2週間</text>
  <text x="145" y="182" text-anchor="middle" class="small-text">実践レベル: 1〜3ヶ月</text>
  
  <!-- Demerit 2: Less Freedom -->
  <rect x="280" y="60" width="230" height="140" class="demerit-box" rx="8"/>
  <text x="395" y="90" text-anchor="middle" class="icon">🔒</text>
  <text x="395" y="120" text-anchor="middle" class="label" font-weight="bold">自由度の低下</text>
  <text x="395" y="145" text-anchor="middle" class="small-text">影響度: ⭐⭐</text>
  <text x="395" y="165" text-anchor="middle" class="small-text">規約に従う必要</text>
  <text x="395" y="182" text-anchor="middle" class="small-text">独自実装が困難</text>
  
  <!-- Demerit 3: Dependency Risk -->
  <rect x="530" y="60" width="240" height="140" class="demerit-box" rx="8"/>
  <text x="650" y="90" text-anchor="middle" class="icon">⚠️</text>
  <text x="650" y="120" text-anchor="middle" class="label" font-weight="bold">依存性リスク</text>
  <text x="650" y="145" text-anchor="middle" class="small-text">影響度: ⭐⭐⭐</text>
  <text x="650" y="165" text-anchor="middle" class="small-text">バージョンアップ対応</text>
  <text x="650" y="182" text-anchor="middle" class="small-text">サポート終了リスク</text>
  
  <!-- Row 2 -->
  <!-- Demerit 4: Excessive Features -->
  <rect x="30" y="220" width="230" height="140" class="demerit-box" rx="8"/>
  <text x="145" y="250" text-anchor="middle" class="icon">📦</text>
  <text x="145" y="280" text-anchor="middle" class="label" font-weight="bold">過剰な機能</text>
  <text x="145" y="305" text-anchor="middle" class="small-text">影響度: ⭐⭐</text>
  <text x="145" y="325" text-anchor="middle" class="small-text">アプリサイズ増大</text>
  <text x="145" y="342" text-anchor="middle" class="small-text">複雑化のリスク</text>
  
  <!-- Demerit 5: Performance Overhead -->
  <rect x="280" y="220" width="230" height="140" class="demerit-box" rx="8"/>
  <text x="395" y="250" text-anchor="middle" class="icon">⏱️</text>
  <text x="395" y="280" text-anchor="middle" class="label" font-weight="bold">パフォーマンス</text>
  <text x="395" y="305" text-anchor="middle" class="small-text">影響度: ⭐⭐</text>
  <text x="395" y="325" text-anchor="middle" class="small-text">オーバーヘッド</text>
  <text x="395" y="342" text-anchor="middle" class="small-text">5〜15%の性能低下</text>
  
  <!-- Mitigation Box -->
  <rect x="530" y="220" width="240" height="140" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="650" y="250" text-anchor="middle" class="icon">💡</text>
  <text x="650" y="280" text-anchor="middle" class="label" font-weight="bold">対処法</text>
  <text x="650" y="305" text-anchor="middle" class="small-text">✓ 適切な選択</text>
  <text x="650" y="325" text-anchor="middle" class="small-text">✓ 計画的な学習</text>
  <text x="650" y="342" text-anchor="middle" class="small-text">✓ バージョン管理</text>
  
  <!-- Bottom comparison chart -->
  <rect x="50" y="390" width="700" height="140" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" rx="8"/>
  <text x="400" y="420" text-anchor="middle" class="label" font-weight="bold">デメリットとメリットのバランス</text>
  
  <!-- Balance scale visualization -->
  <!-- Left side - Demerits -->
  <text x="100" y="450" class="small-text" font-weight="bold">デメリット</text>
  <rect x="80" y="460" width="150" height="50" fill="#ffcdd2" stroke="#e57373" stroke-width="2" rx="5"/>
  <text x="155" y="475" text-anchor="middle" class="small-text">学習時間</text>
  <text x="155" y="490" text-anchor="middle" class="small-text">制約・リスク</text>
  <text x="155" y="505" text-anchor="middle" class="small-text">オーバーヘッド</text>
  
  <!-- Center - Balance point -->
  <path d="M 260 485 L 290 485" stroke="#757575" stroke-width="3"/>
  <circle cx="275" cy="485" r="8" fill="#757575"/>
  <text x="275" y="460" text-anchor="middle" class="small-text" font-weight="bold">vs</text>
  
  <!-- Right side - Merits -->
  <text x="620" y="450" class="small-text" font-weight="bold">メリット</text>
  <rect x="570" y="460" width="180" height="50" fill="#c8e6c9" stroke="#81c784" stroke-width="2" rx="5"/>
  <text x="660" y="475" text-anchor="middle" class="small-text">開発速度30〜50%向上</text>
  <text x="660" y="490" text-anchor="middle" class="small-text">セキュリティ・品質向上</text>
  <text x="660" y="505" text-anchor="middle" class="small-text">保守性・拡張性向上</text>
  
  <!-- Arrow pointing right (merits outweigh) -->
  <path d="M 310 485 L 540 485" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4caf50" />
    </marker>
  </defs>
  
  <text x="425" y="475" text-anchor="middle" class="small-text" fill="#2e7d32" font-weight="bold">多くの場合</text>
  <text x="425" y="495" text-anchor="middle" class="small-text" fill="#2e7d32" font-weight="bold">メリット＞デメリット</text>
</svg>
